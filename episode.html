<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Taxanaha taariikhda ummadda Soomaaliyeed: 28 xalqo oo ku salaysan in ka badan 25 marjic, laga bilaabo waayihii hore ilaa xorriyaddii 1960. A weekly series on the history of the Somali nation, from ancient Punt to independence in 1960.">
  <meta name="theme-color" content="#14304f">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- How the page looks when a link is shared on WhatsApp, Facebook, X, Telegram... -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Taxanaha Taariikhda Ummadda Soomaaliyeed">
  <meta property="og:title" content="Taxanaha Taariikhda Ummadda Soomaaliyeed · Episode">
  <meta property="og:description" content="Taxanaha taariikhda ummadda Soomaaliyeed: 28 xalqo oo ku salaysan in ka badan 25 marjic, laga bilaabo waayihii hore ilaa xorriyaddii 1960. A weekly series on the history of the Somali nation, from ancient Punt to independence in 1960.">
  <meta property="og:image" content="https://mohammed382-bit.github.io/somali-timeline/share-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://mohammed382-bit.github.io/somali-timeline/episode.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://mohammed382-bit.github.io/somali-timeline/share-image.jpg">


  <!-- episode.js replaces this with the episode's title -->
  <title>Episode</title>

  <!-- Same fonts and design as the timeline page -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2026-10-13b">
</head>
<body id="top">
  <a id="skip-link" class="skip-link" href="#main">Skip to content</a>

  <!-- The same menu bar as the timeline page -->
  <header class="site-header">
    <nav class="top-nav">
      <div class="nav-links">
        <a href="index.html" id="nav-home" class="nav-link">Home</a>
        <a href="timeline.html" id="nav-timeline" class="nav-link">Episodes</a>
        <a href="sources.html" id="nav-sources" class="nav-link">Sources</a>
        <a href="about.html" id="nav-about" class="nav-link">About</a>
      </div>
      <button id="language-toggle">Soomaali</button>
    </nav>

    <!-- episode.js fills in these three -->
    <div class="hero">
      <p id="episode-label" class="episode-label"></p>
      <h1 id="page-title"></h1>
      <p id="episode-years" class="episode-years"></p>
      <p id="episode-release" class="episode-release"></p>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- VIDEO: episode.js puts the YouTube player (or "coming soon") here -->
    <section class="media-section" id="video-section">
      <h2 id="video-heading" class="media-heading"></h2>
      <div id="video-box"></div>
    </section>

    <article class="episode-body">
      <!-- Share and print buttons -->
      <div class="episode-tools">
        <button id="share-button" type="button" class="tool-button"></button>
        <button id="print-button" type="button" class="tool-button"></button>
        <span id="tool-note" class="tool-note" role="status"></span>
      </div>

      <!-- The short summary, shown larger -->
      <p id="episode-summary" class="episode-summary"></p>
      <p id="episode-readtime" class="episode-readtime"></p>

      <!-- Contents list: only for episodes with a full article -->
      <nav id="episode-toc" class="episode-toc" hidden>
        <h2 id="toc-heading" class="toc-heading"></h2>
        <ol id="toc-list"></ol>
      </nav>

      <!-- The text: the short version, or (if the episode has one) the full written article -->
      <p id="episode-details"></p>
      <div id="episode-article"></div>

      <!-- Shown for episodes that do not have their full script yet -->
      <p id="article-soon" class="article-soon" hidden></p>

      <!-- The books this episode comes from -->
      <p id="episode-sources" class="event-sources"></p>
    </article>

    <!-- PICTURES and MAPS: hidden unless this episode has some (see media.js) -->
    <section class="media-section" id="pictures-section" hidden>
      <h2 id="pictures-heading" class="media-heading"></h2>
      <div id="pictures-gallery" class="gallery"></div>
    </section>

    <section class="media-section" id="maps-section" hidden>
      <h2 id="maps-heading" class="media-heading"></h2>
      <div id="maps-gallery" class="gallery"></div>
    </section>

    <!-- Previous / All episodes / Next -->
    <nav class="episode-nav">
      <a id="link-previous" class="episode-nav-link"></a>
      <a id="link-all" class="episode-nav-link" href="timeline.html"></a>
      <a id="link-next" class="episode-nav-link"></a>
    </nav>
  </main>

  <!-- The pop-up window for a large picture. <dialog> is a built-in HTML pop-up. -->
  <dialog id="lightbox">
    <button id="lightbox-close" class="lightbox-close">×</button>
    <img id="lightbox-image" alt="">
    <p id="lightbox-caption" class="lightbox-caption"></p>
    <p id="lightbox-credit" class="lightbox-credit"></p>
  </dialog>

  <footer>
    <p id="footer-text"></p>
    <p id="footer-links" class="footer-links"></p>
  </footer>

  <!-- Text and media lists first, then shared code, then this page's code -->
  <script src="data.js?v=2026-10-13b"></script>
  <script src="media.js?v=2026-10-13b"></script>
  <script src="common.js?v=2026-10-13b"></script>
  <script src="episode.js?v=2026-10-13b"></script>
</body>
</html>
